name: Kalshi macro monitor
on:
  schedule:
    - cron: "17 */6 * * *"          # every 6 hours (UTC); Kalshi's public API needs no key
  workflow_dispatch:
  push:                             # a human push to the monitor's own files runs it immediately
    branches: [main]                # (bot commits made with GITHUB_TOKEN never re-trigger this)
    paths: ["live/kalshi/**", ".github/workflows/kalshi.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pull-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests numpy pandas
      - name: Pull Kalshi markets
        run: python live/kalshi/pull_kalshi.py
      - name: Commit the snapshot
        run: |
          git config user.name "signal-live bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/kalshi/data.json live/kalshi/history.json
          git diff --cached --quiet || git commit -m "kalshi: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
      # commits made with GITHUB_TOKEN do not trigger the push workflow, so deploy from here
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
