<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthony Russo — Signal model cards</title>
<meta name="description" content="Six validated macro and markets models, the graveyard of ideas that failed the same tests, and the data infrastructure behind them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e13; --bg2:#10151d; --card:#131a24; --card2:#182131; --line:rgba(127,140,163,.20);
  --fg:#e6edf3; --mute:#8b98a5; --dim:#5c6877; --acc:#e8b04a; --blue:#4c8fd6; --green:#5cb88a; --red:#e0777d;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --sans:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1360px;margin:0 auto;padding:28px 22px 60px}

/* header */
header{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.3px}
header .tag{color:var(--mute);margin-top:4px;font-size:15px}
header .links{display:flex;gap:16px;font-family:var(--mono);font-size:13px;margin-top:10px}
.hero{display:flex;gap:28px;flex-wrap:wrap}
.hero .n{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--fg);line-height:1}
.hero .l{color:var(--mute);font-size:12.5px;margin-top:5px}
.meta{color:var(--dim);font-family:var(--mono);font-size:12px;margin-top:14px}

/* sections */
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:34px 0 14px;font-weight:700}
h2 span{color:var(--dim);font-weight:500;letter-spacing:0;text-transform:none;margin-left:10px;font-size:12.5px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px}
@media (min-width:1300px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s;min-width:0}
.card:hover{border-color:rgba(232,176,74,.55);background:var(--card2);transform:translateY(-1px)}
.card .dom{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.card h3{margin:2px 0 0;font-size:16.5px;font-weight:700;line-height:1.25}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.head .big{font-family:var(--mono);font-size:38px;font-weight:500;color:var(--fg);line-height:1;letter-spacing:-1px}
.head .lab{color:var(--mute);font-size:12.5px;max-width:260px;line-height:1.3}
.head .vs{font-family:var(--mono);font-size:12px;color:var(--green);width:100%}
.chart{width:100%;position:relative}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.legend i.dash{border-top-style:dashed}
.legend b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
table.rows{border-collapse:collapse;width:100%;font-size:12.8px}
table.rows td{padding:6px 6px 6px 0;vertical-align:top;border-top:1px solid var(--line)}
table.rows td:first-child{color:var(--mute);width:84px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-top:8px}
.card table.rows td:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#c9d3dd}
.verdict{font-size:13.2px;border-left:3px solid var(--acc);padding:4px 0 4px 10px;color:var(--fg)}
.verdict::before{content:"Verdict · ";color:var(--acc);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.card .more{color:var(--dim);font-family:var(--mono);font-size:11px;text-align:right;margin-top:-4px}

/* stats tables */
table.stats{border-collapse:collapse;font-family:var(--mono);font-size:12px;width:100%}
table.stats th{color:var(--mute);font-weight:500;text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.stats td{text-align:right;padding:5px 8px;border-bottom:1px solid rgba(127,140,163,.09);white-space:nowrap}
table.stats th:first-child,table.stats td:first-child{text-align:left;color:var(--fg);white-space:normal}
table.stats tr:first-child td:first-child{color:var(--fg)}
.tblwrap{overflow-x:auto}
.cap{color:var(--dim);font-size:12px;margin:6px 0 0}

/* graveyard */
table.grave{border-collapse:collapse;width:100%;font-size:13px}
table.grave th{text-align:left;color:var(--mute);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
table.grave td{padding:9px 14px 9px 0;vertical-align:top;border-bottom:1px solid rgba(127,140,163,.10)}
table.grave td:first-child{font-weight:600;width:29%}
table.grave td:nth-child(2){width:46%}
table.grave td:last-child{color:var(--mute);font-size:12.3px}
table.grave td .nb{display:block;color:var(--dim);font-family:var(--mono);font-size:11px;margin-top:3px}

/* infra */
.infra{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.infra .it{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px}
.infra .n{font-family:var(--mono);font-size:22px;color:var(--fg)}
.infra .t{font-weight:700;margin-top:4px}
.infra .d{color:var(--mute);font-size:12.5px;margin-top:4px}

/* method + footer */
.method{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:13.5px}
.method ol{margin:8px 0 0;padding-left:20px}
.method li{margin:3px 0}
footer{color:var(--dim);font-family:var(--mono);font-size:12px;margin-top:36px;border-top:1px solid var(--line);padding-top:14px}

/* phones */
@media (max-width:640px){
  .wrap{padding:18px 14px 40px}
  header h1{font-size:25px}
  header .tag{font-size:14px}
  header .links{flex-wrap:wrap;gap:8px 14px}
  .hero{gap:14px 22px}
  .hero .n{font-size:20px}
  .head .big{font-size:32px}
  .head .lab{max-width:none}
  .card{padding:14px 12px 12px}
  .card h3{font-size:15.5px}
  table.rows td:first-child{width:70px;font-size:10px}
  table.grave,table.grave tbody,table.grave tr,table.grave td{display:block;width:auto}
  table.grave thead{display:none}
  table.grave tr{border-bottom:1px solid var(--line);padding:10px 0}
  table.grave td{border:0;padding:2px 0}
  table.grave td:first-child{width:auto;padding-bottom:4px}
  table.grave td:nth-child(2){width:auto}
  table.grave td:nth-child(2)::before{content:"killed by · ";color:var(--acc);font-family:var(--mono);font-size:11px}
  table.grave td:last-child::before{content:"test · ";color:var(--acc);font-family:var(--mono);font-size:11px}
  .sheet{inset:6px;padding:14px 12px 24px;border-radius:8px}
  .sheet h3{font-size:18px}
  .sheet .x{padding:6px 12px}
  .method{padding:12px 14px;font-size:13px}
  h2{margin:26px 0 12px}
  h2 span{display:block;margin:4px 0 0}
}

/* sheet (expanded card) */
.backdrop{position:fixed;inset:0;background:rgba(3,5,8,.72);backdrop-filter:blur(3px);display:none;z-index:20}
.backdrop.on{display:block}
.sheet{position:fixed;inset:24px;max-width:1100px;margin:0 auto;background:var(--card);border:1px solid rgba(127,140,163,.35);border-radius:10px;overflow:auto;display:none;z-index:21;padding:22px 26px 30px}
.sheet.on{display:block}
.sheet .x{position:sticky;top:0;float:right;background:var(--card2);border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:12px}
.sheet h3{font-size:22px;margin:4px 0 2px}
.sheet table.rows{font-size:13.5px}
.sheet table.rows td:first-child{width:110px}
.sheet table.stats{width:auto;min-width:60%}
@media (max-width:820px){.sheet{inset:8px;padding:16px}}
.sheet h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px;font-weight:500}
.sheet .src{color:var(--dim);font-family:var(--mono);font-size:11.5px;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 id="name"></h1>
    <div class="tag" id="tagline"></div>
    <div class="links" id="links"></div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="hero" id="hero"></div>
</header>

<h2>Models <span>click a card for the full model card</span></h2>
<div class="grid" id="cards"></div>

<h2>The graveyard <span id="gnote"></span></h2>
<div class="tblwrap"><table class="grave" id="grave"></table></div>

<h2>Infrastructure <span>built to make the tests above cheap to run</span></h2>
<div class="infra" id="infra"></div>

<h2>Method <span>the four tests every candidate faces</span></h2>
<div class="method" id="method"></div>

<footer id="foot"></footer>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>

/* ---------- utilities ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ms = d => Date.parse(d + "T00:00:00Z");
const fmt = (v, nd) => v == null ? "" : (typeof v === "number" ? (Number.isInteger(v) ? v.toLocaleString() : v.toFixed(nd == null ? (Math.abs(v) < 10 ? 2 : 1) : nd)) : v);
function niceTicks(lo, hi, n) {
  const span = hi - lo, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => span / s <= n + 1) || 10 * p;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10)); return out;
}
function yearTicks(x0, x1, maxn) {
  const y0 = new Date(x0).getUTCFullYear(), y1 = new Date(x1).getUTCFullYear();
  const step = Math.max(1, Math.ceil((y1 - y0 + 1) / maxn));
  const out = []; for (let y = y0 + 1; y <= y1; y++) if ((y - y0) % step === 0 || step === 1) out.push([Date.UTC(y, 0, 1), String(y)]);
  return out.filter(t => t[0] >= x0 && t[0] <= x1);
}

/* ---------- line chart (SVG) ---------- */
function linePanel(svg, cfg, box, opts) {
  const { x0, y0px, W, H, xs, xmin, xmax } = box;
  const L = 46, R = 10, T = opts.top || 8, B = opts.bottom || 20;
  const pw = W - L - R, ph = H - T - B;
  const X = t => x0 + L + (t - xmin) / (xmax - xmin) * pw;
  // y domain
  let vals = [];
  (cfg.series || []).forEach(s => s.y.forEach(v => v != null && vals.push(v)));
  (cfg.bands || []).forEach(b => { b.lo.forEach(v => v != null && vals.push(v)); b.hi.forEach(v => v != null && vals.push(v)); });
  (cfg.fill || []).forEach(s => s.y.forEach(v => v != null && vals.push(v)));
  if (cfg.bars) cfg.bars.y.forEach(v => v != null && vals.push(v));
  if (cfg.hline != null) vals.push(cfg.hline);
  if (cfg.hband) vals.push(...cfg.hband);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (cfg.ylim) { lo = cfg.ylim[0]; hi = cfg.ylim[1]; }
  else if (cfg.log) { const pad = (Math.log10(hi) - Math.log10(lo)) * 0.06 || 0.1; lo = Math.pow(10, Math.log10(lo) - pad); hi = Math.pow(10, Math.log10(hi) + pad); }
  else { const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad; if (cfg.y0 || cfg.fill || cfg.bars) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); } }
  const log = !!cfg.log;
  const tr = v => log ? Math.log10(v) : v;
  const Y = v => y0px + T + (1 - (tr(v) - tr(lo)) / (tr(hi) - tr(lo))) * ph;
  let g = "";
  // grid + y ticks
  let ticks;
  if (log) { ticks = []; const a = Math.floor(Math.log10(lo)), b = Math.ceil(Math.log10(hi)); for (let e = a; e <= b; e++) [1, 2, 5].forEach(m => { const v = m * Math.pow(10, e); if (v >= lo && v <= hi) ticks.push(v); }); }
  else ticks = niceTicks(lo, hi, 4);
  ticks.forEach(v => { const y = Y(v); g += `<line x1="${x0 + L}" x2="${x0 + L + pw}" y1="${y}" y2="${y}" stroke="rgba(127,140,163,.13)"/>`; g += `<text x="${x0 + L - 6}" y="${y + 3.5}" font-size="10" fill="#8b98a5" text-anchor="end" font-family="IBM Plex Mono,monospace">${fmt(v, log ? (v < 1 ? 1 : 0) : (Math.abs(v) < 2 ? 2 : (Math.abs(v) < 10 ? 1 : 0)))}</text>`; });
  // x ticks
  if (!opts.noX) yearTicks(xmin, xmax, pw / 70).forEach(([t, l]) => { g += `<line x1="${X(t)}" x2="${X(t)}" y1="${y0px + T}" y2="${y0px + T + ph}" stroke="rgba(127,140,163,.10)"/><text x="${X(t)}" y="${y0px + T + ph + 13}" font-size="10" fill="#8b98a5" text-anchor="middle" font-family="IBM Plex Mono,monospace">${l}</text>`; });
  // clip
  const cid = "c" + Math.random().toString(36).slice(2, 8);
  g += `<clipPath id="${cid}"><rect x="${x0 + L}" y="${y0px + T}" width="${pw}" height="${ph}"/></clipPath><g clip-path="url(#${cid})">`;
  (cfg.shade || []).forEach(([a, b]) => { g += `<rect x="${X(ms(a))}" y="${y0px + T}" width="${Math.max(1.5, X(ms(b)) - X(ms(a)))}" height="${ph}" fill="rgba(224,119,125,.18)"/>`; });
  if (cfg.hband) g += `<rect x="${x0 + L}" y="${Y(cfg.hband[1])}" width="${pw}" height="${Y(cfg.hband[0]) - Y(cfg.hband[1])}" fill="rgba(127,140,163,.10)"/>`;
  if (cfg.y0 && lo < 0 && hi > 0) g += `<line x1="${x0 + L}" x2="${x0 + L + pw}" y1="${Y(0)}" y2="${Y(0)}" stroke="#8b98a5" stroke-width="1"/>`;
  if (cfg.hline != null) g += `<line x1="${x0 + L}" x2="${x0 + L + pw}" y1="${Y(cfg.hline)}" y2="${Y(cfg.hline)}" stroke="#e0777d" stroke-width="1" stroke-dasharray="4,3"/>`;
  (cfg.bands || []).forEach(b => {
    let up = "", dn = "";
    for (let i = 0; i < xs.length; i++) if (b.lo[i] != null && b.hi[i] != null) { up += (up ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(b.hi[i]).toFixed(1); dn = "L" + X(xs[i]).toFixed(1) + " " + Y(b.lo[i]).toFixed(1) + dn; }
    if (up) g += `<path d="${up}${dn}Z" fill="${b.color}" opacity="${b.alpha}"/>`;
  });
  (cfg.fill || []).forEach(s => {
    let p = ""; const z = Y(0);
    for (let i = 0; i < xs.length; i++) if (s.y[i] != null) { const xx = X(xs[i]).toFixed(1); p += (p ? `L${xx} ${Y(s.y[i]).toFixed(1)}` : `M${xx} ${z}L${xx} ${Y(s.y[i]).toFixed(1)}`); }
    if (p) g += `<path d="${p}L${X(xs[xs.length - 1]).toFixed(1)} ${z}Z" fill="${s.color}" opacity="${s.alpha != null ? s.alpha : .32}"/>`;
  });
  if (cfg.bars) { const z = Y(0), bw = Math.max(1, pw / xs.length - 0.5); for (let i = 0; i < xs.length; i++) { const v = cfg.bars.y[i]; if (v == null) continue; const y = Y(v); g += `<rect x="${(X(xs[i]) - bw / 2).toFixed(1)}" y="${Math.min(y, z).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.abs(z - y).toFixed(1)}" fill="${cfg.bars.ok[i] ? '#5cb88a' : '#e0777d'}" opacity=".85"/>`; } }
  (cfg.series || []).forEach(s => {
    if (s.fillAbove != null) {                       // area between the threshold and the line where it exceeds it
      const z = Y(s.fillAbove); let p = "", pen = false;
      for (let i = 0; i < xs.length; i++) { const v = s.y[i]; const xx = X(xs[i]).toFixed(1);
        if (v != null && v > s.fillAbove) { p += (pen ? `L${xx} ${Y(v).toFixed(1)}` : `M${xx} ${z}L${xx} ${Y(v).toFixed(1)}`); pen = true; }
        else if (pen) { p += `L${X(xs[i - 1]).toFixed(1)} ${z}Z`; pen = false; } }
      if (pen) p += `L${X(xs[xs.length - 1]).toFixed(1)} ${z}Z`;
      if (p) g += `<path d="${p}" fill="${s.color}" opacity=".85"/>`;
    }
    let p = "", pen = false;
    for (let i = 0; i < xs.length; i++) { const v = s.y[i]; if (v == null || (log && v <= 0)) { pen = false; continue; } p += (pen ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(v).toFixed(1); pen = true; }
    g += `<path d="${p}" fill="none" stroke="${s.color}" stroke-width="${s.width || 1.2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.dots) for (let i = 0; i < xs.length; i++) if (s.y[i] != null) g += `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(s.y[i]).toFixed(1)}" r="2.2" fill="${s.color}"/>`;
  });
  g += `</g>`;
  if (cfg.ylabel) g += `<text x="${x0 + 4}" y="${y0px + T + 9}" font-size="10" fill="#5c6877" font-family="IBM Plex Mono,monospace">${esc(cfg.ylabel)}</text>`;
  return g;
}
/* charts are drawn in a viewBox whose width follows the container, so axis text stays
   legible on a phone instead of scaling down 2.5x with a fixed 800-unit box */
function chartW(el) { const w = el.clientWidth || 800; return w < 420 ? 400 : (w < 640 ? 560 : 800); }
const REGISTRY = [];
function drawLines(el, cfg, height) {
  const W = chartW(el), H = Math.round((height || 300) * (W < 800 ? 1.15 : 1));
  const xs = cfg.x.map(ms); const xmin = xs[0], xmax = xs[xs.length - 1];
  let g = "";
  if (cfg.sub) {
    const h1 = Math.round(H * 0.66), h2 = H - h1;
    g += linePanel(null, cfg, { x0: 0, y0px: 0, W, H: h1, xs, xmin, xmax }, { noX: true, bottom: 6 });
    const sxs = cfg.sub.x.map(ms);
    g += linePanel(null, cfg.sub, { x0: 0, y0px: h1, W, H: h2, xs: sxs, xmin, xmax }, { top: 6 });
  } else g += linePanel(null, cfg, { x0: 0, y0px: 0, W, H, xs, xmin, xmax }, {});
  let leg = (cfg.series || []).map(s => `<span><i style="border-color:${s.color}" class="${s.dash ? 'dash' : ''}"></i>${esc(s.name)}</span>`).join("");
  if (cfg.fill) leg += cfg.fill.map(s => `<span><b style="background:${s.color};opacity:.6;border-radius:2px;width:12px"></b>${esc(s.name)}</span>`).join("");
  if (cfg.sub && cfg.sub.series) leg += cfg.sub.series.map(s => `<span><i style="border-color:${s.color}"></i>${esc(s.name)}</span>`).join("");
  if (cfg.sub && cfg.sub.fill) leg += cfg.sub.fill.map(s => `<span><i style="border-color:${s.color}"></i>${esc(s.name)} drawdown</span>`).join("");
  if (cfg.sub && cfg.sub.bars) leg += `<span><b style="background:#5cb88a"></b>direction right</span><span><b style="background:#e0777d"></b>wrong</span>`;
  if (cfg.shade && cfg.shade.length) leg += `<span><b style="background:rgba(224,119,125,.5);border-radius:2px;width:12px"></b>dial firing</span>`;
  el.innerHTML = (cfg.title ? `<div class="cap" style="margin:0 0 4px">${esc(cfg.title)}</div>` : "") + `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg><div class="legend">${leg}</div>`;
}

/* ---------- scatter (GMM) ---------- */
function drawScatter(el, cfg, height) {
  const W = chartW(el), H = Math.round((height || 300) * (W < 800 ? 1.15 : 1)), L = 46, R = 10, T = 8, B = 22, pw = W - L - R, ph = H - T - B;
  const xc = cfg.xclamp || 8;
  const ys = cfg.pts.map(p => p[1]); const ymax = Math.max(...ys) * 1.03, ymin = 0;
  const X = v => L + (Math.max(-xc, Math.min(xc, v)) + xc) / (2 * xc) * pw;
  const Y = v => T + (1 - (Math.sqrt(Math.max(v, 0)) - Math.sqrt(ymin)) / (Math.sqrt(ymax) - Math.sqrt(ymin))) * ph;
  let g = "";
  [-8, -4, -2, 0, 2, 4, 8].forEach(v => { g += `<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${T + ph}" stroke="rgba(127,140,163,${v === 0 ? .35 : .12})"/><text x="${X(v)}" y="${T + ph + 13}" font-size="10" fill="#8b98a5" text-anchor="middle" font-family="IBM Plex Mono,monospace">${v > 0 ? "+" + v : v}</text>`; });
  [5, 10, 20, 40, 80].forEach(v => { if (v < ymax) g += `<line x1="${L}" x2="${L + pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(127,140,163,.13)"/><text x="${L - 6}" y="${Y(v) + 3.5}" font-size="10" fill="#8b98a5" text-anchor="end" font-family="IBM Plex Mono,monospace">${v}</text>`; });
  const key = { A: "CALM", S: "STRESSED", X: "CRISIS" };   // point codes (CALM and CRISIS share a first letter)
  cfg.pts.forEach(p => { const cls = key[p[2]] || "CRISIS"; g += `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="1.7" fill="${cfg.colors[cls]}" opacity=".45"/>`; });
  cfg.ellipses.forEach(e => {
    // component ellipses at 1σ (solid) and 2σ (dashed), as on dashboard v2: parametric in data
    // space, mapped point by point because the axes have different scales
    const a = e.angle * Math.PI / 180;
    [[1, "", 1.8], [2, "5,4", 1.1]].forEach(([n, dash, w]) => {
      let d = "";
      for (let k = 0; k <= 96; k++) { const t = k / 96 * 2 * Math.PI; const ex = n * e.rx * Math.cos(t), ey = n * e.ry * Math.sin(t); const x = e.cx + ex * Math.cos(a) - ey * Math.sin(a), y = e.cy + ex * Math.sin(a) + ey * Math.cos(a); d += (k ? "L" : "M") + X(x).toFixed(1) + " " + Y(Math.max(y, 0.1)).toFixed(1); }
      g += `<path d="${d}Z" fill="none" stroke="${cfg.colors[e.name]}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ""} opacity=".9"/>`;
    });
    g += `<text x="${X(e.cx) + 8}" y="${Y(e.cy) - 6}" font-size="11" font-weight="700" fill="${cfg.colors[e.name]}" font-family="IBM Plex Mono,monospace">${e.name}</text>`;
  });
  if (cfg.today) g += `<circle cx="${X(cfg.today.ret)}" cy="${Y(cfg.today.vol)}" r="5.5" fill="none" stroke="#e6edf3" stroke-width="2"/><text x="${X(cfg.today.ret) + 9}" y="${Y(cfg.today.vol) + 4}" font-size="11" fill="#e6edf3" font-family="IBM Plex Mono,monospace">today · ${cfg.today.regime} · P ${cfg.today.p.toFixed(2)}</text>`;
  g += `<text x="4" y="${T + 9}" font-size="10" fill="#5c6877" font-family="IBM Plex Mono,monospace">${esc(cfg.ylabel)}</text>`;
  g += `<text x="${L + pw}" y="${T + ph + 13}" font-size="10" fill="#5c6877" text-anchor="end" font-family="IBM Plex Mono,monospace">${esc(cfg.xlabel)}</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg><div class="legend">${Object.entries(cfg.colors).map(([k, c]) => `<span><b style="background:${c}"></b>${k}</span>`).join("")}<span>solid = 1σ, dashed = 2σ of each component · every 2nd day plotted</span></div>`;
}
function drawChart(el, cfg, height) {
  if (!REGISTRY.some(r => r.el === el)) REGISTRY.push({ el, cfg, height });
  if (cfg.type === "scatter") drawScatter(el, cfg, height); else drawLines(el, cfg, height);
}
let _rt = null;
window.addEventListener("resize", () => { clearTimeout(_rt); _rt = setTimeout(() => REGISTRY.forEach(r => { if (document.body.contains(r.el)) (r.cfg.type === "scatter" ? drawScatter : drawLines)(r.el, r.cfg, r.height); }), 200); });

/* ---------- tables ---------- */
function statsTable(rows, cap) {
  if (!rows || !rows.length) return "";
  const [h, ...b] = rows;
  return `<div class="tblwrap"><table class="stats"><thead><tr>${h.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.map(r => `<tr>${r.map((c, i) => `<td>${esc(fmt(c))}</td>`).join("")}</tr>`).join("")}</tbody></table>${cap ? `<div class="cap">${esc(cap)}</div>` : ""}</div>`;
}
function rowsTable(r) {
  return `<table class="rows"><tr><td>What it does</td><td>${esc(r.does)}</td></tr><tr><td>How tested</td><td>${esc(r.tested)}</td></tr><tr><td>Where it breaks</td><td>${esc(r.breaks)}</td></tr></table>`;
}

/* ---------- render ---------- */
function header() {
  const m = D.meta;
  document.getElementById("name").textContent = m.name;
  document.getElementById("tagline").textContent = m.tagline;
  document.getElementById("links").innerHTML = (m.github ? `<a href="${esc(m.github)}" target="_blank" rel="noopener">github ↗</a>` : "") + (m.email ? `<a href="mailto:${esc(m.email)}">${esc(m.email)}</a>` : "") + (m.live || []).map(l => `<a href="${esc(l.href)}">${esc(l.label)} →</a>`).join("");
  document.getElementById("meta").textContent = `every figure regenerated ${m.built} from the notebooks · data cut ${m.cut}`;
  document.getElementById("hero").innerHTML = D.hero.map(h => `<div><div class="n">${esc(h.n)}</div><div class="l">${esc(h.l)}</div></div>`).join("");
}
function cards() {
  const g = document.getElementById("cards");
  D.cards.forEach((c, i) => {
    const el = document.createElement("div"); el.className = "card"; el.dataset.i = i;
    el.innerHTML = `<div class="dom">${esc(c.domain)}</div><h3>${esc(c.title)}</h3>
      <div class="head"><div class="big">${esc(c.headline.value)}</div><div class="lab">${esc(c.headline.label)}</div><div class="vs">${esc(c.headline.vs)}</div></div>
      <div class="chart"></div>${rowsTable(c.rows)}<div class="verdict">${esc(c.verdict)}</div><div class="more">as of ${esc(c.asof)} · open full card →</div>`;
    g.appendChild(el);
    drawChart(el.querySelector(".chart"), c.chart, 290);
    el.addEventListener("click", () => openSheet(c));
  });
}
function extraTables(c) {
  let h = "";
  if (c.eras) h += `<h4>By era</h4>` + statsTable([["era", c.id === "dial" ? "gap vs quiet (pp)" : "R² vs AR", c.id === "dial" ? "phases positive" : "n", c.id === "dial" ? "fire %" : ""].filter(Boolean), ...c.eras]);
  if (c.twokey) h += `<h4>Two-key state (options dial × VX-futures dial), 21d</h4>` + statsTable(c.twokey);
  if (c.conviction) h += `<h4>Conviction: hit rate by |signal| quintile, h=6</h4>` + statsTable([["quintile", "n", "direction hit", "|forecast − no-change|"], ...c.conviction], "The model is silent most months and right when it shouts — read the point forecast only above ~1.5pp.");
  if (c.ledger) h += `<h4>The cliff ledger — every INDPRO contraction (yoy < 0 for 3+ months)</h4>` + statsTable([["cliff start", "months below zero", "6m forecast first < 0, months before", "called in advance"], ...c.ledger.map(e => [e.start, e.months, e.lead == null ? "never" : e.lead, e.called ? "yes" : (e.lead === 0 ? "coincident" : "missed")])]);
  if (c.transition) h += `<h4>Transition structure — P(tomorrow | today), hard labels</h4>` + statsTable(c.transition, "The zero cells are the ladder: CALM never jumps straight to CRISIS and CRISIS never cools straight to CALM.");
  if (c.production) h += `<h4>Raw posterior vs the EMA10 production dial</h4>` + statsTable(c.production);
  if (c.frontier) h += `<h4>The sleeve split — every rotation weight, same months</h4>` + statsTable(c.frontier, "Max Sharpe sits on a plateau around 50–70% rotation; the chosen 60% is vol parity, not a fitted point.");
  if (c.sleeve) h += `<h4>Inside the engine — the static option-sleeve weight, same months</h4>` + statsTable(c.sleeve, "10% static is the deployed choice; annual refits of this weight were tested and rejected as survivor-window artifacts.");
  if (c.loo) h += `<h4>Leave-one-out membership, h=6</h4>` + statsTable(c.loo, "Positive delta = removing the gauge hurts. Baa spread is a passenger at this horizon.");
  if (c.betas) h += `<h4>Expanding-window coefficients</h4>` + statsTable(c.betas);
  if (c.halves) h += `<h4>Stability</h4>` + statsTable(c.halves);
  if (c.weights) h += `<h4>Live gauge weights, top 6 (share of total)</h4>` + statsTable([["gauge", "%"], ...c.weights]);
  if (c.annual) h += `<h4>Calendar years, %</h4>` + statsTable([["", ...c.annual.years], ["book", ...c.annual.book], ["QQQ", ...c.annual.qqq]]);
  return h;
}
function openSheet(c) {
  const s = document.getElementById("sheet");
  s.innerHTML = `<div class="x" id="close">close ✕</div><div class="dom" style="font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)">${esc(c.domain)}</div><h3>${esc(c.title)}</h3>
    <div class="head"><div class="big">${esc(c.headline.value)}</div><div class="lab" style="max-width:520px">${esc(c.headline.label)}</div><div class="vs">${esc(c.headline.vs)}</div></div>
    <div class="chart" id="sc1" style="margin-top:10px"></div>
    ${c.chart2 ? `<div class="chart" id="sc2" style="margin-top:18px"></div>` : ""}
    <div style="margin-top:16px">${rowsTable(c.rows)}<div class="verdict" style="margin-top:12px">${esc(c.verdict)}</div></div>
    <div><h4>Numbers</h4>${statsTable(c.stats)}${extraTables(c)}</div>
    <div class="src">data: ${esc(c.sources)}<br>notebook: ${esc(c.notebook)}<br>as of ${esc(c.asof)} · data cut ${esc(c.cut)}</div>`;
  document.getElementById("backdrop").classList.add("on"); s.classList.add("on"); s.scrollTop = 0;
  drawChart(document.getElementById("sc1"), c.chart, 360);
  if (c.chart2) drawChart(document.getElementById("sc2"), c.chart2, 300);
  document.getElementById("close").onclick = closeSheet;
}
function closeSheet() { document.getElementById("backdrop").classList.remove("on"); document.getElementById("sheet").classList.remove("on"); }
document.getElementById("backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function graveyard() {
  document.getElementById("gnote").textContent = D.graveyard.note;
  document.getElementById("grave").innerHTML = `<tr><th>idea</th><th>what killed it</th><th>the test that did it</th></tr>` +
    D.graveyard.rows.map(r => `<tr><td>${esc(r.idea)}</td><td>${esc(r.killed)}</td><td>${esc(r.test)}<span class="nb">${esc(r.nb)}</span></td></tr>`).join("");
}
function infra() {
  document.getElementById("infra").innerHTML = D.infra.map(i => `<div class="it"><div class="n">${esc(i.n)}</div><div class="t">${esc(i.t)}</div><div class="d">${esc(i.d)}</div></div>`).join("");
}
function method() {
  document.getElementById("method").innerHTML = D.method;
  document.getElementById("foot").innerHTML = `${esc(D.meta.name)} · ${esc(D.meta.foot)}`;
}
header(); cards(); graveyard(); infra(); method();
</script>
</body>
